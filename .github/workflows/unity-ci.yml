# GameCI (unity-test-runner v4, unity-builder v6): EditMode tests, then Android (APK) and WebGL builds.
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL and UNITY_PASSWORD. GameCI (game-ci/cli based actions) activates a Personal seat with just these.
#   No .ulf needed. See docs/CI-LICENSE.md.
# Until they exist this workflow fails at license activation. That is expected.
name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # unity-test-runner posts the EditMode results as a check run

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [Android, WebGL]
    steps:
      - name: Free disk space (Android image is large)
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - uses: game-ci/unity-builder@v6
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: StreetEmpire.EditorTools.CIBuild.Build
          # pinned: resolving "latest" calls the GitHub API unauthenticated and can hit a 403 rate limit
          cliVersion: v0.1.76
          buildName: StreetEmpire
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: StreetEmpire-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
