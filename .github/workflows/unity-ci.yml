# GameCI (unity-test-runner v4, unity-builder v6): EditMode tests, then Android (APK) and WebGL builds.
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL and UNITY_PASSWORD. GameCI (game-ci/cli based actions) activates a Personal seat with just these.
#   No .ulf needed. See docs/CI-LICENSE.md.
# Until they exist this workflow fails at license activation. That is expected.
name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Android bisect variant (gles3, lz4hc, or both); empty for a normal build"
        required: false
        default: ""

permissions:
  contents: read
  checks: write # unity-test-runner posts the EditMode results as a check run
  issues: write # the Android build posts its memory samples to issue #38 (see Watch memory)

concurrency:
  group: unity-ci-${{ github.ref }}-${{ inputs.variant || 'main' }}
  cancel-in-progress: true

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Tests (EditMode and PlayMode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # LFS objects come from the Actions cache, so runs only spend LFS bandwidth when the models change
      - uses: actions/checkout@v4
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Git LFS pull (cache misses only)
        run: git lfs pull && rm .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      # v75t: the wave A and B buildings (about 700 MB of GLBs with 4096 maps) push the editor past the runner's 16 GB
      # while glTFast imports them on a cold Library; swap on the big /mnt disk keeps the import from being killed
      - name: Add swap (large building imports)
        run: |
          sudo swapoff -a || true
          D=/mnt; [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 30 ] || D=/
          sudo fallocate -l 16G $D/se-swapfile && sudo chmod 600 $D/se-swapfile && sudo mkswap $D/se-swapfile && sudo swapon $D/se-swapfile || echo "no swap added"
          free -h; df -h /
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: all
          cliVersion: v0.1.76 # pinned: the "latest" lookup can hit a GitHub API 403
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJSON(inputs.variant && '["Android"]' || '["Android", "WebGL"]') }}
    steps:
      - name: Free disk space (Android image is large)
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
      # LFS objects come from the Actions cache, so runs only spend LFS bandwidth when the models change
      - uses: actions/checkout@v4
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Git LFS pull (cache misses only)
        run: git lfs pull && rm .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library2-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library2-${{ matrix.targetPlatform }}-
      - name: Build label for the HUD (which build is installed)
        run: mkdir -p Assets/Resources && echo "v0.5 ${GITHUB_SHA::7}" > Assets/Resources/build-label.txt
      # v75t: the wave A and B buildings (about 700 MB of GLBs with 4096 maps) push the editor past the runner's 16 GB
      # while glTFast imports them on a cold Library; swap on the big /mnt disk keeps the import from being killed
      - name: Add swap (large building imports)
        run: |
          sudo swapoff -a || true
          D=/mnt; [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 30 ] || D=/
          sudo fallocate -l 16G $D/se-swapfile && sudo chmod 600 $D/se-swapfile && sudo mkswap $D/se-swapfile && sudo swapon $D/se-swapfile || echo "no swap added"
          free -h; df -h /
      # Four Android builds in two days lost their runner at the start of the IL2CPP step, and a dead runner takes
      # its log with it. This keeps one comment on issue #38 updated every minute with memory, swap, disk and the
      # biggest processes, so the last reading before a drop survives. It must outlive this step, hence the
      # cleared RUNNER_TRACKING_ID and setsid.
      - name: Watch memory (Android)
        if: matrix.targetPlatform == 'Android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/memwatch.sh" <<'WATCH'
          #!/usr/bin/env bash
          head="Run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT, commit ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/38/comments" -f body="$head: started" --jq .id) || exit 0
          log=""
          while true; do
            m=$(free -m | awk '/Mem:/{printf "mem used %d free %d avail %d MB", $3, $4, $7} /Swap:/{printf ", swap used %d MB", $3}')
            d=$(df -BG --output=avail / /mnt 2>/dev/null | tail -n +2 | tr -d ' \n' | sed 's/G/G /g')
            l=$(cut -d' ' -f1 /proc/loadavg)
            t=$(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<5 {printf "%s %dMB; ", $2, $1/1024}')
            log="$(printf '%s\n%s | %s | disk free %s| load %s | %s' "$log" "$(date -u +%H:%M:%S)" "$m" "$d" "$l" "$t" | tail -n 45)"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$(printf '%s\n```\n%s\n```' "$head" "$log")" >/dev/null 2>&1 || true
            sleep 30
          done
          WATCH
          chmod +x "$RUNNER_TEMP/memwatch.sh"
          RUNNER_TRACKING_ID="" setsid nohup "$RUNNER_TEMP/memwatch.sh" >/dev/null 2>&1 &
      - uses: game-ci/unity-builder@v6
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: StreetEmpire.EditorTools.CIBuild.Build
          # pinned: resolving "latest" calls the GitHub API unauthenticated and can hit a 403 rate limit
          cliVersion: v0.1.76
          buildName: StreetEmpire
          # -nographics: the build makes no pictures, but with a graphics device every building model the scene
          # builder loads has its 4096 maps uploaded to the runner's software OpenGL, which lives in RAM. The memory
          # watch (issue #38) measured the editor at 12.4 GB resident while Unity itself accounted for 3.6 GB; that
          # gap is what pushed the runner into 10 GB of swap and dropped it.
          customParameters: -nographics -seVariant ${{ inputs.variant || 'none' }}
          versioning: Semantic
          # one persistent release key (kept off the repo), so each APK installs over the last; the version
          # code is the workflow run number, which only goes up
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: streetempire-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      # every APK must carry the one release certificate (public fingerprint, from keys/README-KEEP-THIS-KEY.md)
      # so it installs over the previous one; fail the run otherwise
      - name: Check APK signer and version code
        if: matrix.targetPlatform == 'Android'
        run: |
          APK=$(find build/Android -name '*.apk' | head -1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$SIGNER/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -qi "SHA-256 digest: fc309cd288ad3b2904e4181a0f31480cd907715a081d25c954d6b58743442f65" signer.txt || { echo "APK is not signed with the release key"; exit 1; }
          "$SIGNER/aapt2" dump badging "$APK" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: StreetEmpire-${{ matrix.targetPlatform }}${{ inputs.variant && format('-{0}', inputs.variant) || '' }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
